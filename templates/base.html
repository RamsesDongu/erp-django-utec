<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inicio{% endblock %} | Dongu's - Autos de Lujo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* TOKENS DE COLOR - ESTILO PROFESIONAL */
        :root, [data-theme="light"] {
            --clr-navy   : #1A1A1A; 
            --clr-gold   : #D4AF37; 
            --clr-bg     : #F7F5F0; 
            --clr-surface: #FFFFFF;
            --clr-text   : #1C1C1C;
            --clr-muted  : #6B6B6B;
            --clr-border : #E0D8C8;
            --shadow-sm  : 0 4px 12px rgba(0,0,0,.05);
            --shadow-md  : 0 8px 24px rgba(26,26,26,.15);
        }
        
        /* ESTILO GENERAL */
        body {
            font-family: 'Inter','Segoe UI',sans-serif;
            background: var(--clr-bg);
            color: var(--clr-text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA SUPERIOR DISCRETA */
        .top-bar {
            background: transparent;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1.5rem;
        }
        .top-bar a {
            color: var(--clr-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .top-bar a:hover { color: var(--clr-gold); }
        .top-bar .admin-btn {
            background: var(--clr-navy);
            color: var(--clr-gold);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--clr-gold);
        }
        .top-bar .admin-btn:hover { background: var(--clr-gold); color: var(--clr-navy); }

        /* BOTONES PRINCIPALES (Las tarjetas) */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
        }

        /* TÍTULO GIGANTE Y DESTACADO */
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            color: var(--clr-gold);
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 0;
            line-height: 1;
            text-shadow: 3px 3px 20px rgba(212, 175, 55, 0.3);
        }
        .hero-subtitle {
            text-align: center;
            color: var(--clr-muted);
            font-size: 1.3rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 4rem;
            font-weight: 300;
        }

        /* LAS TARJETAS/BOTONES */
        .erp-card-btn {
            background: var(--clr-surface);
            border: 1px solid var(--clr-border);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            padding: 3rem 1.5rem;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .erp-card-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--clr-gold);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }
        .erp-card-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15);
            border-color: var(--clr-gold);
            color: var(--clr-text);
        }
        .erp-card-btn:hover::before { transform: scaleX(1); }
        
        .card-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }
        .erp-card-btn:hover .card-icon { transform: scale(1.1); }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--clr-navy);
            font-weight: 700;
            margin: 0;
        }
        .card-desc {
            color: var(--clr-muted);
            font-size: 0.95rem;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* TABLAS Y FORMULARIOS */
        .erp-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .erp-table thead th { background: var(--clr-navy); color: var(--clr-gold); padding: .75rem 1rem; text-transform: uppercase; font-size: .82rem; letter-spacing: .06em; border-bottom: 3px solid var(--clr-gold); }
        .erp-table tbody td { background: var(--clr-surface); padding: .65rem 1rem; border-bottom: 1px solid var(--clr-border); }
        .btn-erp-gold { background: linear-gradient(135deg, #D4AF37 0%, #E5C158 100%); color: var(--clr-navy); border-radius: 8px; padding: .45rem 1.2rem; font-weight: 600; text-decoration: none; transition: all .3s; border: none; cursor: pointer;}
        .btn-erp-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6); color: var(--clr-navy);}
        .btn-erp-primary { background: var(--clr-navy); color: var(--clr-gold); border: 1px solid var(--clr-gold); border-radius: 8px; padding: .45rem 1.2rem; text-decoration: none; transition: all .3s; }
        .btn-erp-primary:hover { background: var(--clr-gold); color: var(--clr-navy); }
        .btn-erp-danger { background: var(--clr-danger); color: #FFF; border-radius: 8px; padding: .4rem 1rem; text-decoration: none; border: none; }
        .erp-input { background: var(--clr-surface); border: 1.5px solid var(--clr-border); border-radius: 8px; padding: .5rem .85rem; width: 100%; }
        .erp-input:focus { outline: none; border-color: var(--clr-gold); }
    </style>
</head>

<body>
    <!-- TOP BAR -->
    <header class="top-bar">
        {% if user.is_authenticated %}
            <span style="color: var(--clr-navy); font-weight: 600;"><i class="fas fa-user-circle"></i> {{ user.username }}</span>
            <a href="/accounts/logout/">Cerrar Sesión</a>
        {% else %}
            <a href="/accounts/login/">Iniciar Sesión</a>
        {% endif %}
        <a href="/admin/" class="admin-btn"><i class="fas fa-cog"></i> Admin</a>
    </header>

    <!-- CONTENIDO -->
    <main>
        {% if messages %}
        <div class="container mt-3">
            {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% elif m.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
